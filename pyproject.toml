[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mhtl-ftt"
version = "0.1.0"
description = "Multi-task FT-Transformer with task-specific negative sampling"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "scipy>=1.10,<2",
    "scikit-learn>=1.3,<2",
    "torch>=2.1,<3",
    "matplotlib>=3.7,<4",
    "joblib>=1.3,<2",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9", "build>=1,<2"]

[project.scripts]
mhtl-ftt = "mhtl_ftt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

